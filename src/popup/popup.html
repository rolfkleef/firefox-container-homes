<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Container Homes slots</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 id="container" class="container-name"></h1>
  <ul id="rows" role="listbox" aria-labelledby="container" tabindex="0" hidden></ul>
  <p id="status" class="status" role="alert" hidden></p>
  <div id="empty" class="empty" hidden>
    <p>No home or slots set for this container.</p>
    <button id="open-options" type="button">Open settings</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
