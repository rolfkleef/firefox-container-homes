name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  sign-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Verify manifest version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Check whether this is a pre-release (unlisted) version
        id: version-check
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if echo "$manifest_version" | grep -qE '(a|b|pre|rc)[0-9]*$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$manifest_version has no pre-release suffix (a/b/pre/rc), so it's treated as a listed-channel version reserved for manual AMO submission. Skipping automated signing and release."
          fi

      - name: Sign extension with AMO
        if: steps.version-check.outputs.is_prerelease == 'true'
        run: npm run sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Create GitHub release
        if: steps.version-check.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: web-ext-artifacts/*.xpi
          generate_release_notes: true
          prerelease: true
